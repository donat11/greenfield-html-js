<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenfield University - Enroll in a Class</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Greenfield University</h1>
        <p class="tagline">Class Login System</p>
        <p id="liveClock" class="live-clock"></p>
        <nav>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
            <ul id="navMenu">
                <li id="nav-home"><a href="index.html">Home</a></li>
                <li id="nav-about"><a href="about.html">About</a></li>
                <li id="nav-contact"><a href="contact.html">Contact</a></li>
                <li id="nav-login"><a href="login.html">Login</a></li>
                <li id="nav-register-student"><a href="register-student.html">Register (Student)</a></li>
                <li id="nav-register-admin"><a href="register-admin.html">Register (Admin)</a></li>
                <li id="nav-enroll"><a href="enroll.html">Enroll in a Class</a></li>
                <li id="nav-dashboard" style="display:none"><a href="student-dashboard.html">Dashboard</a></li>
                <li id="nav-logout" style="display:none"><a href="#" id="logoutLink">Logout</a></li>
                <li id="nav-datetime"><a href="datetime.php">Server Date &amp; Time (PHP)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="enroll-form">
            <h2>Enroll in a Class</h2>

            <div id="enrollMessage" class="message" style="display:none"></div>

            <form id="enrollForm" novalidate>
                <label for="student_name">Student Name</label>
                <input type="text" id="student_name" name="student_name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="class">Choose a Class</label>
                <select id="class" name="class" required>
                    <option value="">-- Select a class --</option>
                </select>

                <button type="submit">Enroll</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Greenfield University. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        let currentStudent = null;

        document.addEventListener("DOMContentLoaded", async () => {
            const data = await initPage();
            currentStudent = requireRole("student");
            if (!currentStudent) return;

            document.getElementById("student_name").value = currentStudent.fullname;
            document.getElementById("email").value = currentStudent.email || "";
            populateClasses(data.classes);

            document.getElementById("enrollForm").addEventListener("submit", handleEnroll);
        });

        function populateClasses(classes) {
            const select = document.getElementById("class");
            classes.forEach(cls => {
                const option = document.createElement("option");
                option.value = cls.name;
                option.textContent = cls.name;
                select.appendChild(option);
            });
        }

        function handleEnroll(e) {
            e.preventDefault();

            const studentName = document.getElementById("student_name").value.trim();
            const email = document.getElementById("email").value.trim();
            const selectedClass = document.getElementById("class").value;

            if (!studentName || !email || !selectedClass) {
                showMessage("enrollMessage", "Please fill in all fields.", "error");
                return;
            }
            if (!isValidEmail(email)) {
                showMessage("enrollMessage", "Please enter a valid email address.", "error");
                return;
            }

            saveEnrollment(currentStudent.username, selectedClass);
            showMessage("enrollMessage", studentName + " has been enrolled in " + selectedClass + "!", "success");
        }
    </script>

</body>
</html>
